<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Running Speedometer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0e1a;
    color: #fff;
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 16px 20px;
    user-select: none;
    -webkit-user-select: none;
  }
  h1 {
    font-size: 18px;
    font-weight: 300;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #5a6a8a;
    margin-bottom: 28px;
  }
  .gauge-container {
    position: relative;
    width: 260px;
    height: 260px;
    margin-bottom: 32px;
  }
  canvas#gauge { display: block; }
  .speed-display {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  .speed-val {
    font-size: 58px;
    font-weight: 700;
    letter-spacing: -2px;
    background: linear-gradient(135deg, #00e5ff, #7c4dff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1;
  }
  .speed-unit {
    font-size: 16px;
    color: #5a6a8a;
    margin-top: 4px;
    font-weight: 300;
    letter-spacing: 2px;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #333;
    margin: 0 auto 6px;
    transition: background 0.4s;
  }
  .status-dot.active { background: #00e5ff; box-shadow: 0 0 8px #00e5ff66; }

  .stats {
    display: flex;
    gap: 12px;
    width: 100%;
    max-width: 320px;
    margin-bottom: 32px;
  }
  .stat-card {
    flex: 1;
    background: #131828;
    border: 1px solid #1e2440;
    border-radius: 16px;
    padding: 18px 10px;
    text-align: center;
  }
  .stat-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #5a6a8a;
    margin-bottom: 8px;
  }
  .stat-value {
    font-size: 22px;
    font-weight: 600;
    color: #e0e4f0;
  }
  .stat-sub {
    font-size: 11px;
    color: #5a6a8a;
    margin-top: 3px;
  }

  .controls {
    display: flex;
    gap: 14px;
    width: 100%;
    max-width: 320px;
  }
  .btn {
    flex: 1;
    padding: 16px;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-start {
    background: linear-gradient(135deg, #00e5ff, #7c4dff);
    color: #fff;
    flex: 2;
  }
  .btn-start:active { transform: scale(0.96); }
  .btn-reset {
    background: #1e2440;
    color: #5a6a8a;
  }
  .btn-reset:active { transform: scale(0.96); }

  .msg {
    margin-top: 18px;
    font-size: 12px;
    color: #5a6a8a;
    text-align: center;
    min-height: 16px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<h1>Running Speedometer</h1>

<div class="gauge-container">
  <canvas id="gauge" width="260" height="260"></canvas>
  <div class="speed-display">
    <div class="status-dot" id="statusDot"></div>
    <div class="speed-val" id="speedVal">0.0</div>
    <div class="speed-unit">m/s</div>
  </div>
</div>

<div class="stats">
  <div class="stat-card">
    <div class="stat-label">Distance</div>
    <div class="stat-value" id="distVal">0.00</div>
    <div class="stat-sub" id="distUnit">m</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Elapsed</div>
    <div class="stat-value" id="timeVal">0:00</div>
    <div class="stat-sub">mm:ss</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Max Speed</div>
    <div class="stat-value" id="maxVal">0.0</div>
    <div class="stat-sub">m/s</div>
  </div>
</div>

<div class="controls">
  <button class="btn btn-reset" id="btnReset">Reset</button>
  <button class="btn btn-start" id="btnStart">Start</button>
</div>
<div class="msg" id="msg"></div>

<script>
const canvas = document.getElementById('gauge');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const cx = W/2, cy = H/2, R = 110;

let running = false, watchId = null;
let lastPos = null, totalDist = 0, maxSpeed = 0, curSpeed = 0, targetSpeed = 0;
let startTime = null, elapsed = 0, timerInterval = null, smoothInterval = null;

const MAX_SPEED = 12; // m/s (~43 km/h, generous max for gauge)
const START_ANGLE = 0.75 * Math.PI; // 135deg
const END_ANGLE = 0.25 * Math.PI;  // 45deg (going clockwise full arc = 270deg)
const ARC_RANGE = 1.5 * Math.PI;   // 270 degrees

function drawGauge(speed) {
  ctx.clearRect(0, 0, W, H);

  // Background circle
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.strokeStyle = '#1e2440';
  ctx.lineWidth = 14;
  ctx.stroke();

  // Speed ratio
  let ratio = Math.min(speed / MAX_SPEED, 1);

  // Colored arc
  let endA = START_ANGLE + ratio * ARC_RANGE;
  ctx.beginPath();
  ctx.arc(cx, cy, R, START_ANGLE, endA);

  // Gradient color based on speed
  let grad = ctx.createArcGradient ? null : null;
  // Fallback: use linear gradient approximation
  let grd = ctx.createLinearGradient(cx - R, cy, cx + R, cy);
  if (ratio < 0.4) {
    grd.addColorStop(0, '#00e5ff');
    grd.addColorStop(1, '#00bcd4');
  } else if (ratio < 0.7) {
    grd.addColorStop(0, '#00e5ff');
    grd.addColorStop(1, '#7c4dff');
  } else {
    grd.addColorStop(0, '#7c4dff');
    grd.addColorStop(1, '#ff5252');
  }
  ctx.strokeStyle = grd;
  ctx.lineWidth = 14;
  ctx.lineCap = 'round';
  ctx.stroke();

  // Tick marks & labels
  let ticks = [0, 2, 4, 6, 8, 10, 12];
  ticks.forEach(v => {
    let t = v / MAX_SPEED;
    let a = START_ANGLE + t * ARC_RANGE;
    let x1 = cx + (R - 18) * Math.cos(a);
    let y1 = cy + (R - 18) * Math.sin(a);
    let x2 = cx + (R - 8)  * Math.cos(a);
    let y2 = cy + (R - 8)  * Math.sin(a);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = '#3a4466';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.stroke();

    // Label
    let lx = cx + (R - 30) * Math.cos(a);
    let ly = cy + (R - 30) * Math.sin(a);
    ctx.fillStyle = '#5a6a8a';
    ctx.font = '11px Segoe UI';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(v, lx, ly);
  });

  // Needle dot at current position
  if (ratio > 0) {
    let na = START_ANGLE + ratio * ARC_RANGE;
    let nx = cx + R * Math.cos(na);
    let ny = cy + R * Math.sin(na);
    ctx.beginPath();
    ctx.arc(nx, ny, 7, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.shadowColor = ratio < 0.7 ? '#00e5ff' : '#ff5252';
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  let dLat = (lat2 - lat1) * Math.PI / 180;
  let dLon = (lon2 - lon1) * Math.PI / 180;
  let a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function onPos(pos) {
  let {latitude: lat, longitude: lon, accuracy} = pos.coords;
  let now = pos.timestamp;

  if (accuracy > 20) return; // skip inaccurate

  if (lastPos) {
    let dt = (now - lastPos.t) / 1000;
    if (dt > 0) {
      let d = haversine(lastPos.lat, lastPos.lon, lat, lon);
      // Filter out noise: if distance is unreasonably large for dt
      let spd = d / dt;
      if (spd < 30) { // max ~108 km/h sanity check
        targetSpeed = spd;
        totalDist += d;
        if (targetSpeed > maxSpeed) maxSpeed = targetSpeed;
      }
    }
  }
  lastPos = { lat, lon, t: now };
  updateUI();
}

function onErr(e) {
  let msgs = {1:'Location permission denied.', 2:'Location unavailable.', 3:'Timeout.'};
  document.getElementById('msg').textContent = msgs[e.code] || 'GPS error.';
  stopTracking();
}

function startTracking() {
  if (!navigator.geolocation) { document.getElementById('msg').textContent='GPS not supported.'; return; }
  running = true;
  startTime = Date.now();
  elapsed = 0;
  document.getElementById('btnStart').textContent = 'Stop';
  document.getElementById('statusDot').classList.add('active');
  document.getElementById('msg').textContent = 'Tracking...';

  timerInterval = setInterval(() => {
    elapsed = (Date.now() - startTime) / 1000;
    document.getElementById('timeVal').textContent = fmtTime(elapsed);
  }, 500);

  // Smooth interpolation loop at 100ms
  smoothInterval = setInterval(() => {
    let diff = targetSpeed - curSpeed;
    let ease = Math.abs(diff) < 0.05 ? diff : diff * 0.18;
    curSpeed += ease;
    if (Math.abs(curSpeed) < 0.01) curSpeed = 0;
    updateUI();
  }, 100);

  watchId = navigator.geolocation.watchPosition(onPos, onErr, {
    enableHighAccuracy: true, maximumAge: 0, timeout: 10000
  });
}

function stopTracking() {
  running = false;
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  clearInterval(timerInterval); timerInterval = null;
  clearInterval(smoothInterval); smoothInterval = null;
  curSpeed = 0; targetSpeed = 0;
  document.getElementById('btnStart').textContent = 'Start';
  document.getElementById('statusDot').classList.remove('active');
  document.getElementById('msg').textContent = 'Stopped.';
  updateUI();
}

function resetAll() {
  stopTracking();
  lastPos = null; totalDist = 0; maxSpeed = 0; curSpeed = 0; elapsed = 0;
  document.getElementById('msg').textContent = '';
  updateUI();
  drawGauge(0);
}

function fmtTime(s) {
  let m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

function updateUI() {
  document.getElementById('speedVal').textContent = curSpeed.toFixed(1);
  document.getElementById('maxVal').textContent = maxSpeed.toFixed(1);
  if (totalDist >= 1000) {
    document.getElementById('distVal').textContent = (totalDist/1000).toFixed(2);
    document.getElementById('distUnit').textContent = 'km';
  } else {
    document.getElementById('distVal').textContent = totalDist.toFixed(1);
    document.getElementById('distUnit').textContent = 'm';
  }
  drawGauge(curSpeed);
}

document.getElementById('btnStart').addEventListener('click', () => { running ? stopTracking() : startTracking(); });
document.getElementById('btnReset').addEventListener('click', resetAll);

// Initial draw
drawGauge(0);
</script>
</body>
</html>
